<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 2532">
<style>
  .a { transform-box: fill-box; animation-fill-mode: both; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  .tile   { transform-origin: center; animation: pop 600ms 0ms both cubic-bezier(.34,1.56,.64,1); }
  .paper  { animation-name: rise; animation-duration: 500ms; animation-delay: 200ms; }
  .fold   { transform-origin: 0% 0%; animation-name: fold; animation-duration: 250ms; animation-delay: 600ms; }
  .line   { transform-origin: 0% 50%; animation-name: draw; animation-duration: 300ms; }
  .l1 { animation-delay: 700ms; } .l2 { animation-delay: 820ms; }
  .l3 { animation-delay: 940ms; } .l4 { animation-delay: 1060ms; }
  .px     { transform-origin: center; animation: fly 500ms both cubic-bezier(.22,1,.36,1), float 2400ms ease-in-out infinite alternate; }
  .p1 { animation-delay: 900ms, 1400ms; } .p2 { animation-delay: 1000ms, 1500ms; }
  .p3 { animation-delay: 1100ms, 1600ms; } .p4 { animation-delay: 1200ms, 1700ms; }
  .title  { animation-name: up; animation-duration: 400ms; animation-delay: 1000ms; }
  .sub    { animation-name: up; animation-duration: 400ms; animation-delay: 1200ms; }
  @keyframes pop   { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes rise  { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: none; } }
  @keyframes fold  { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes draw  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes fly   { from { opacity: 0; transform: translate(-90px, 90px) scale(.3); } to { opacity: 1; transform: none; } }
  @keyframes float { from { transform: translateY(0); } to { transform: translateY(-14px); } }
  @keyframes up    { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="1170" height="2532" fill="#0B1F3A"/>
<g transform="translate(585 1050)">
  <g class="a tile">
    <rect x="-260" y="-260" width="520" height="520" rx="116" fill="#1E3A6E" stroke="#C9A227" stroke-width="10"/>
  </g>
  <g transform="scale(0.48) translate(-512 -512)">
    <g class="a paper">
      <path d="M302 222 H622 L722 322 V802 H302 Z" fill="#FAF7F0"/>
      <g class="a fold"><path d="M622 222 V322 H722 Z" fill="#E6DCC4"/></g>
      <rect class="a line l1" x="362" y="402" width="300" height="26" rx="13" fill="#1E3A6E"/>
      <rect class="a line l2" x="362" y="482" width="230" height="26" rx="13" fill="#1E3A6E" opacity="0.75"/>
      <rect class="a line l3" x="362" y="562" width="270" height="26" rx="13" fill="#1E3A6E" opacity="0.75"/>
      <rect class="a line l4" x="362" y="682" width="160" height="34" rx="17" fill="#C9A227"/>
    </g>
    <rect class="a px p1" x="742" y="262" width="40" height="40" fill="#C9A227"/>
    <rect class="a px p2" x="802" y="202" width="30" height="30" fill="#C9A227" fill-opacity="0.8"/>
    <rect class="a px p3" x="742" y="182" width="24" height="24" fill="#C9A227" fill-opacity="0.6"/>
    <rect class="a px p4" x="842" y="142" width="18" height="18" fill="#C9A227" fill-opacity="0.45"/>
  </g>
</g>
<text class="a title" x="585" y="1470" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Roboto, Arial, sans-serif" font-size="120" font-weight="700" fill="#FAF7F0">DigiLekha</text>
<text class="a sub" x="585" y="1560" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Roboto, Arial, sans-serif" font-size="54" font-style="italic" fill="#AEB9CC">Kaagaz se digital tak</text>
</svg>
